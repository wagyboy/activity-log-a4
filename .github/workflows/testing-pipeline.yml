name: A5 Testing Pipeline

on:
  push:
    branches: [chore/test-automation]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_env:
        description: Test configuration
        type: choice
        options: [staging, prod]
        default: staging
      failure_demo:
        description: Intentional failing assertion for release-gate evidence
        type: choice
        options: [none, unit, integration]
        default: none

permissions:
  contents: read

concurrency:
  group: a5-testing-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TEST_ENV: ${{ inputs.test_env || 'staging' }}
  TZ: Asia/Taipei

jobs:
  build:
    if: github.repository == 'wagyboy/activity-log-a4'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build action bundle
        run: bun run build
      - name: Package build once
        run: |
          set -euo pipefail
          test -s dist/index.js
          mkdir -p artifacts
          zip -r artifacts/build.zip dist action.yml README.md LICENSE
          (cd artifacts && sha256sum build.zip > SHA256SUMS)
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('artifacts/source.json', JSON.stringify({source_sha: process.env.GITHUB_SHA}));"
          printf '## A5 Build\n\nSource: `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a5-build
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  test-unit:
    name: Unit tests (Node.js ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Download the build from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: a5-build
          path: artifacts
      - name: Verify and restore the built artifact
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum --check SHA256SUMS)
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(JSON.parse(fs.readFileSync('artifacts/source.json', 'utf8')).source_sha, process.env.GITHUB_SHA);"
          rm -rf -- dist
          unzip -o artifacts/build.zip -d .
          test -s dist/index.js
          mkdir -p reports
      - name: Run unit tests and enforce 80 percent line coverage
        id: tests
        run: |
          set -euo pipefail
          node --version
          printf 'TEST_ENV=%s\n' "$TEST_ENV"
          node --test \
            --experimental-test-coverage \
            --test-coverage-include='**/src/utils/templateEngine.js' \
            --test-coverage-lines=80 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=reports/unit-junit.xml \
            --test-reporter=lcov --test-reporter-destination=reports/unit-lcov.info \
            tests/templateEngine.test.js | tee reports/unit.log
          test -s reports/unit-lcov.info
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.match(fs.readFileSync('reports/unit-lcov.info','utf8'), /SF:.*templateEngine\\.js/);"
      - name: Intentional failure demonstration
        if: github.event_name == 'workflow_dispatch' && inputs.failure_demo == 'unit'
        id: failure_demo
        run: |
          set -euo pipefail
          cat > reports/intentional-failure.test.mjs <<'JS'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          test('Intentional assertion failure to prove release blocking', () => {
            assert.equal(2 + 2, 5, 'Deliberate failure demonstration, not an application defect');
          });
          JS
          node --test --test-reporter=tap reports/intentional-failure.test.mjs | tee reports/failure-demo.log
      - name: Write test summary
        if: always()
        env:
          NODE_VERSION: ${{ matrix.node }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          DEMO_OUTCOME: ${{ steps.failure_demo.outcome }}
        run: |
          printf '## Unit tests - Node.js %s\n\nTEST_ENV: %s\n\nTests: %s\n\nFailure demonstration: %s\n\n' \
            "$NODE_VERSION" "$TEST_ENV" "$TEST_OUTCOME" "$DEMO_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          printf 'Coverage scope: src/utils/templateEngine.js; line threshold: 80%%.\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [[ -s reports/unit.log ]]; then
            sed -n '/start of coverage report/,/end of coverage report/p' reports/unit.log >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test reports even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a5-unit-node-${{ matrix.node }}
          path: reports/
          if-no-files-found: warn
          retention-days: 90

  test-integration:
    name: Integration tests (Node.js ${{ matrix.node }})
    needs: test-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Download the build from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: a5-build
          path: artifacts
      - name: Verify and restore the built artifact
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum --check SHA256SUMS)
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(JSON.parse(fs.readFileSync('artifacts/source.json', 'utf8')).source_sha, process.env.GITHUB_SHA);"
          rm -rf -- dist
          unzip -o artifacts/build.zip -d .
          test -s dist/index.js
          mkdir -p reports
      - name: Run integration tests
        id: tests
        run: |
          set -euo pipefail
          node --version
          printf 'TEST_ENV=%s\n' "$TEST_ENV"
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=reports/integration-junit.xml \
            tests/activity.integration.test.js | tee reports/integration.log
      - name: Intentional failure demonstration
        if: github.event_name == 'workflow_dispatch' && inputs.failure_demo == 'integration'
        id: failure_demo
        run: |
          set -euo pipefail
          cat > reports/intentional-failure.test.mjs <<'JS'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          test('Intentional assertion failure to prove release blocking', () => {
            assert.equal(2 + 2, 5, 'Deliberate failure demonstration, not an application defect');
          });
          JS
          node --test --test-reporter=tap reports/intentional-failure.test.mjs | tee reports/failure-demo.log
      - name: Write test summary
        if: always()
        env:
          NODE_VERSION: ${{ matrix.node }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          DEMO_OUTCOME: ${{ steps.failure_demo.outcome }}
        run: |
          printf '## Integration tests - Node.js %s\n\nTEST_ENV: %s\n\nTests: %s\n\nFailure demonstration: %s\n\n' \
            "$NODE_VERSION" "$TEST_ENV" "$TEST_OUTCOME" "$DEMO_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a5-integration-node-${{ matrix.node }}
          path: reports/
          if-no-files-found: warn
          retention-days: 90

  deploy-dev:
    if: github.repository == 'wagyboy/activity-log-a4' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch'
    needs: test-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: dev
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node.js 24
        with:
          name: a5-build
          path: artifacts

      - name: Verify and release dev build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_TAG: ${{ vars.BUILD_TAG }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_TAG" =~ ^dev-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ -z "$RELEASE_NOTE" ]]; then
            echo 'Configure dev BUILD_TAG and RELEASE_NOTE before deploying.'
            exit 1
          fi
          cd artifacts
          sha256sum --check SHA256SUMS
          TAG="a5-${BASE_TAG}-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          printf '%s\n\nSource commit: %s\nWorkflow run: https://github.com/%s/actions/runs/%s\n' \
            "$RELEASE_NOTE" "$SOURCE_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > notes.md
          release_url="$(gh release create "$TAG" build.zip SHA256SUMS \
            --target "$SOURCE_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            --prerelease \
            --latest=false)"
          printf '## Dev release\n\nTag: `%s`\n\nRelease: %s\n\n' \
            "$TAG" "$release_url" >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    if: github.repository == 'wagyboy/activity-log-a4' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch'
    needs: deploy-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node.js 24
        with:
          name: a5-build
          path: artifacts

      - name: Verify and release staging build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_TAG: ${{ vars.BUILD_TAG }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_TAG" =~ ^staging-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ -z "$RELEASE_NOTE" ]]; then
            echo 'Configure staging BUILD_TAG and RELEASE_NOTE before deploying.'
            exit 1
          fi
          cd artifacts
          sha256sum --check SHA256SUMS
          TAG="a5-${BASE_TAG}-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          printf '%s\n\nSource commit: %s\nWorkflow run: https://github.com/%s/actions/runs/%s\n' \
            "$RELEASE_NOTE" "$SOURCE_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > notes.md
          release_url="$(gh release create "$TAG" build.zip SHA256SUMS \
            --target "$SOURCE_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            --prerelease \
            --latest=false)"
          printf '## Staging release\n\nTag: `%s`\n\nRelease: %s\n\n' \
            "$TAG" "$release_url" >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    if: github.repository == 'wagyboy/activity-log-a4' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch'
    needs: deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node.js 24
        with:
          name: a5-build
          path: artifacts

      - name: Verify and release production build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_TAG: ${{ vars.BUILD_TAG }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_TAG" =~ ^prod-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ -z "$RELEASE_NOTE" ]]; then
            echo 'Configure production BUILD_TAG and RELEASE_NOTE before deploying.'
            exit 1
          fi
          cd artifacts
          sha256sum --check SHA256SUMS
          TAG="a5-${BASE_TAG}-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          printf '%s\n\nSource commit: %s\nWorkflow run: https://github.com/%s/actions/runs/%s\n' \
            "$RELEASE_NOTE" "$SOURCE_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > notes.md
          release_url="$(gh release create "$TAG" build.zip SHA256SUMS \
            --target "$SOURCE_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            --latest=false)"
          printf '## Production release\n\nTag: `%s`\n\nRelease: %s\n\n' \
            "$TAG" "$release_url" >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

